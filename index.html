<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MOORE / Hainan Spatial Atlas</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#f4f2ed;color:#17201f;font-family:Arial,"Microsoft Yahei",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #d2d2ce}main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 73px)}aside{padding:22px;overflow:auto;border-right:1px solid #d2d2ce}h1{font-size:22px;letter-spacing:-.04em;margin:0 0 12px}small{color:#697876}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:7px 0;background:#fff;border:1px solid #c8d0cb;border-radius:3px}button{cursor:pointer}#map{height:100%;background:#e8ece7}.city{padding:10px;border-bottom:1px solid #ddd;cursor:pointer}.city:hover{background:#e1e8e2}.pill{display:inline-block;border:1px solid #a1aaa5;border-radius:30px;padding:4px 9px;font-size:12px;margin:3px}#status{font-size:12px;color:#49655e;line-height:1.6}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:40vh 60vh}aside{grid-row:2}#map{grid-row:1}header{padding:12px}}</style></head><body><header><strong>MOORE / SPATIAL ATLAS</strong><small>HAINAN · GIS LAB</small></header><main><aside><h1>海南空间图谱</h1><small>Hainan Island / Spatial Layers & City Index</small><input id="search" placeholder="搜索城市 / Search cities"><div><span class="pill">城市参考点</span><span class="pill" id="layercount">GIS 0 layers</span></div><label>底图</label><select id="basemap"><option value="none">无底图（不需要密钥）</option><option value="osm">OpenStreetMap（可能无法访问）</option><option value="tdtvec">天地图 · 矢量（需要 TK）</option><option value="tdtimg">天地图 · 影像（需要 TK）</option></select><input id="tk" placeholder="天地图 TK（仅存于当前页面）"><button id="apply">应用底图</button><label>加载本地 GeoJSON 文件</label><input type="file" id="geojson" accept=".json,.geojson" multiple><div id="status">正在初始化。GeoJSON 数据应为 WGS84 (EPSG:4326)。</div><h3>数据图层</h3><div id="layers">尚未加载 GIS 图层</div><h3>市县索引 · 18</h3><div id="cities"></div></aside><div id="map"></div></main><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script>
const cities=[["海口","Haikou",20.044,110.199],["三亚","Sanya",18.252,109.512],["三沙","Sansha",16.833,112.333],["儋州","Danzhou",19.521,109.581],["五指山","Wuzhishan",18.776,109.517],["琼海","Qionghai",19.258,110.474],["文昌","Wenchang",19.613,110.752],["万宁","Wanning",18.801,110.399],["东方","Dongfang",19.096,108.653],["定安","Ding'an",19.681,110.358],["屯昌","Tunchang",19.351,110.102],["澄迈","Chengmai",19.738,110.006],["临高","Lingao",19.913,109.691],["白沙","Baisha",19.224,109.452],["昌江","Changjiang",19.260,109.051],["乐东","Ledong",18.749,109.173],["陵水","Lingshui",18.507,110.038],["保亭","Baoting",18.640,109.702]];
let map,layerControl={},base;const status=document.querySelector('#status');const layerList=document.querySelector('#layers');function say(s){status.textContent=s}
function start(){if(!window.L){say('地图引擎未加载：请检查 CDN 网络连接。');return;}map=L.map('map',{zoomControl:true}).setView([19.15,109.8],8);cities.forEach(([cn,en,lat,lon])=>L.circleMarker([lat,lon],{radius:5,color:'#164d45',fillColor:'#164d45',fillOpacity:.85}).addTo(map).bindPopup(cn+' / '+en));renderCities('');loadAuto();}
function renderCities(q){const root=document.querySelector('#cities');root.replaceChildren();cities.filter(c=>(c[0]+c[1]).toLowerCase().includes(q.toLowerCase())).forEach(c=>{const d=document.createElement('div');d.className='city';d.textContent=c[0]+' / '+c[1];d.onclick=()=>{map.setView([c[2],c[3]],11);L.popup().setLatLng([c[2],c[3]]).setContent(c[0]+' / '+c[1]).openOn(map)};root.append(d)})}
document.querySelector('#search').oninput=e=>renderCities(e.target.value);
function changeBase(){if(!map)return;if(base)map.removeLayer(base);const which=document.querySelector('#basemap').value,tk=document.querySelector('#tk').value.trim();if(which==='none'){say('无底图模式：城市和 GIS 数据可正常查看。');return;}if(which==='osm')base=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});else{if(!tk){say('请先填写天地图 TK。');return;}const layer=which==='tdtimg'?'img':'vec';base=L.tileLayer('https://t{s}.tianditu.gov.cn/'+layer+'_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER='+layer+'&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk='+encodeURIComponent(tk),{subdomains:'01234567',attribution:'© 天地图',maxZoom:18})}base.on('tileerror',()=>say('底图瓦片请求失败。请检查网络和天地图 TK。矢量图层仍可使用。'));base.addTo(map);say('底图已切换；如地图空白请检查瓦片加载与 TK。')}
document.querySelector('#apply').onclick=changeBase;
function addGeoJSON(name,json){if(!map)throw Error('地图引擎未启动');const layer=L.geoJSON(json,{style:()=>({color:'#146c68',weight:1,fillOpacity:.3}),pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:'#a04b34'}),onEachFeature:(f,l)=>{const p=f.properties||{};const text=Object.entries(p).slice(0,10).map(([k,v])=>k+': '+String(v)).join('\n');l.bindPopup(document.createElement('pre'));l.on('popupopen',e=>e.popup.getElement().querySelector('pre').textContent=text)}}).addTo(map);layerControl[name]=layer;const line=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=true;input.style.width='auto';input.onchange=()=>input.checked?layer.addTo(map):map.removeLayer(layer);line.append(input,document.createTextNode(' '+name+' ('+layer.getLayers().length+')'));if(layerList.textContent==='尚未加载 GIS 图层')layerList.textContent='';layerList.append(line,document.createElement('br'));document.querySelector('#layercount').textContent='GIS '+Object.keys(layerControl).length+' layers';say('已加载 '+name+' · '+layer.getLayers().length+' 个地理要素');}
document.querySelector('#geojson').onchange=async e=>{for(const f of e.target.files){try{addGeoJSON(f.name,JSON.parse(await f.text()))}catch(err){say('加载失败 '+f.name+': '+err.message)}}};
async function loadAuto(){for(const name of ['landuse','roads','buildings','water']){try{const r=await fetch('./data/'+name+'.geojson');if(!r.ok)continue;addGeoJSON(name,await r.json())}catch(err){console.warn('Optional GIS layer',name,err)}}if(!Object.keys(layerControl).length)say('当前显示城市参考点。真实 GIS 图层将在云端构建成功后加载，也可以手动导入 GeoJSON。')}
start();
</script></body></html>
